[workspace]
members = ["crates/devdock-core", "crates/devdock-platform", "src-tauri"]
resolver = "3"

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
devdock-core = { path = "crates/devdock-core" }
devdock-platform = { path = "crates/devdock-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0.21"
walkdir = "2.5.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
