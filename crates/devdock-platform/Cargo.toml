[package]
name = "devdock-platform"
description = "DevDock's OS boundary: Windows process trees (Job Objects). The only crate with unsafe code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
devdock-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_RemoteDesktop",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]

# Not `workspace = true`: the workspace forbids unsafe, and FFI needs it. Here it is
# denied by default and allowed only on the small functions that call Win32, each
# with a SAFETY comment (enforced by clippy::undocumented_unsafe_blocks).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
